name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --locked so CI builds the committed Cargo.lock. Without it a fresh resolve can
      # pass here and differ from what anyone running the tool actually gets.
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
